<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>

    <body>

        <h2>My Registration Form</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="60">
            <br><br>
            <label>Gendar:</label>
            <input type="radio" name="gendar" value="male">male
            <input type="radio" naem="gendar" value="female">female
            <br><br>
            <label for="course">course:</label>
            <select id="course" name="course">
            <option selected>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            </select>
            <br><br>
            <label for="message">Message:</label>
            <input type="textarea" id="message" name="message" rows="5" cols="10">
            <br><br>
            <button type="submit">Register</button>
        </form>
    </body>
</html>
