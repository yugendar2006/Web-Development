<!DOCTYPE html>

<html>
    <head>
        <title>Dropdown menu using selected</title>
    </head>
    <body>
        <form>
            <label for="course">course:</label>
            <select>
                <option>CSE</option>
                <option>ECE</option>
                <option selected>EEE</option>
            </select>
            <br>
            <br>
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
