<!DOCTYPE html>
<html>
    <head>
        <title>Overflow</title>
        <style>
            .box {
             width:200px;
             height: 100px;
             border:2px solid black;
             overflow: auto;
            }
        </style>
    </head>
    <body>
        <div class="box">
            This is a very long paragraph.Iam learning CSS 
            and this text is intentionally made longer than
            the box so that we can understand the overflow property. 
        </div>
    </body>
</html>
