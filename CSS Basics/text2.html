<!DOCTYPE html>
<html>
    <head>
        <title>CSS Text</title>
        <style>
            h1 {
                color: blue;
                text-align: center;
                text-decoration: underline;
                text-transform: uppercase;
            }
            p {
                color:green;
                text-align: left;
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to CSS</h1>
        <p>
            iam learning css text properties.
                </p>
    </body>
</html>
