<!DOCTYPE html>
<html>
    <head>
        <title>Document</title>
    </head>
    <style>
        .box {
            width: 300px;
            height: 200px;

             /* Content */

              /* Padding - space inside the border */
             padding: 20px;

             /* Border - surrounds content + padding */
              border: 5px solid black;

              /* Margin - space outside the border */
              margin: 30px;

              background-color: lightblue;
        }

    </style>
    <body>
        <div class="box">
               Hello CSS
        </div>
    </body>
</html>
